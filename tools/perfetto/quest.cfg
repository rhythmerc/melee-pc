# Perfetto config for Quest frame analysis: scheduling, CPU/GPU clocks,
# ATrace from the app and the system, Adreno render stages, logcat.
#   adb shell perfetto -c - --txt -o /data/misc/perfetto-traces/t.pftrace < tools/perfetto/quest.cfg
duration_ms: 10000
buffers { size_kb: 262144 fill_policy: RING_BUFFER }
buffers { size_kb: 65536 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "sched/sched_wakeup_new"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/gpu_frequency"
      ftrace_events: "power/suspend_resume"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "hal"
      atrace_categories: "input"
      atrace_categories: "sched"
      atrace_apps: "*"
      buffer_size_kb: 65536
      drain_period_ms: 250
    }
  }
}
data_sources { config { name: "linux.process_stats" target_buffer: 1 process_stats_config { scan_all_processes_on_start: true } } }
data_sources { config { name: "gpu.renderstages.oculus" target_buffer: 0 } }
data_sources { config { name: "android.log" target_buffer: 1 android_log_config { log_ids: LID_DEFAULT } } }
